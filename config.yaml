# GoServerPanel — конфигурация
listen: 0.0.0.0:8443
data_dir: /var/lib/goserverpanel

# Если сертификат не найден, при первом запуске создаётся самоподписанный.
# tls_cert: /etc/goserverpanel/panel.crt
# tls_key: /etc/goserverpanel/panel.key

# Ограничение доступа по IP/CIDR (пусто = без ограничений). Настоятельно рекомендуется задать.
allow_cidrs: []
# allow_cidrs:
#   - 203.0.113.0/24
#   - 10.0.0.5

session_hours: 12
terminal_enabled: true
shell: /bin/bash

nginx_sites_available: /etc/nginx/sites-available
nginx_sites_enabled: /etc/nginx/sites-enabled
nginx_bin: nginx
nginx_log_dir: /var/log/nginx
www_root: /var/www
web_user: www-data
php_etc_dir: /etc/php
php_socket_dir: /run/php

# Каталоги, доступные файловому менеджеру
files_roots:
  - /var/www
  - /etc/nginx

# Режим отладки: изменяющие команды (apt, systemctl, nginx, СУБД) не выполняются
dry_run: false
